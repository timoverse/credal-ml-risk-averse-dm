[project]
name = "credal-ml-risk-averse-dm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "hydra-core>=1.3.2",
    "medmnist>=3.0.2",
    "numpy>=2.4.2",
    "nvidia-ml-py==13.590.48",
    "omegaconf>=2.3.0",
    "pre-commit>=4.6.2",
    "prek>=0.3.8",
    "probly @ git+https://github.com/pwhofman/probly@main",
    "pyarrow>=24.0.0",
    "ruff>=0.15.11",
    "scikit-learn>=1.6.0",
    "sqwash>=0.1.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "ty>=0.0.35",
    "wandb>=0.26.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"
output-format = "full"

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "B", # flake8-bugbear
    "UP", # pyupgrade
    "I", # isort
    "S", # bandit
    "C4", # comprehensions
    "TCH", # type-checking imports
    "D", # docstrings
    "ANN", # type annotations
]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "src/kuangliu_resnet.py"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true # allows *args and **kwargs to be Any

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.ruff.lint.per-file-ignores]
# Committed self-test module (see src/cost_sensitive/selftest.py docstring): plain
# asserts are the deliberate, repo-established substitute for pytest here.
"src/cost_sensitive/selftest.py" = ["S101"]
